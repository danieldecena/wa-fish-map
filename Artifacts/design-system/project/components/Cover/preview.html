<!--
  blocks: brand-icon-end 192x256, brand-icon-start 96x256, rating-prime 64x160,
          rating-good 64x96, rating-fair 64x256 (x=480..960, sides are space-* multiples)
  arrangement: a strip of unequal vertical bands bleeding off the right edge, deep
          water at the left of the strip and the hot end of the rating ramp at the
          right - the map read left to right, cold to hot
  pattern: literal motif - the pin head. A disc grid at a 36px pitch (2x space-18),
          r=5 (the legend dot), knocked out of the bands: this product is a field of
          pins over water and nothing else says that as directly
  scales: pitch 36 = 2 x space-18; r 5 = half the 10px marker dot; rx = radius-chrome 14
-->
<style>
  .cover { position: relative; width: 960px; height: 300px; font-family: var(--font-sans, -apple-system, system-ui, sans-serif); overflow: hidden; }
  .cover svg { position: absolute; inset: 0; }
  .deep { fill: var(--brand-icon-end, #004a79); }
  .shallow { fill: var(--brand-icon-start, #1797ae); }
  .prime { fill: var(--rating-prime, #ff383c); }
  .good { fill: var(--rating-good, #ff8d28); }
  .fair { fill: var(--rating-fair, #ffcc00); }
  .dot { fill: var(--surface-background, #ffffff); fill-opacity: .72; }
  .name { position: absolute; left: 40px; bottom: 56px; width: 440px; margin: 0; font-size: 92px; line-height: .92; font-weight: 700; letter-spacing: -.02em; color: var(--text-primary, #000); }
  .tag { position: absolute; left: 40px; bottom: 28px; width: 440px; margin: 0; font-size: 13px; line-height: 18px; color: var(--text-secondary, rgba(60,60,67,0.6)); }
</style>
