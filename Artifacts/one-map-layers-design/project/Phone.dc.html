<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Washington Fishing Map, phone, three layers on</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4fc3dc}a:hover{color:#8ad8e9}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #ffffff;">
  <img src="/_blob/c45ea2687407c99bdce88aabdaf0b6c2" alt="Map of southwest Washington rivers" style="position: absolute; left: -151px; top: 71px; width: 1044px; height: 684px;">

  <div aria-hidden="true" style="position: absolute; left: 70px; top: 346px; width: 44px; height: 44px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.85); box-sizing: border-box;"></div>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="8">
    <div style="{{p.pinStyle}}">
      <svg width="28" height="38" viewBox="-14 -36 28 38" aria-hidden="true"><path d="M0 0L-6.5 -10.5A13 13 0 1 1 6.5 -10.5Z" fill="{{p.color}}" stroke="#ffffff" stroke-width="1.5"></path><circle cx="0" cy="-21.6" r="4" fill="#ffffff" fill-opacity="0.9"></circle></svg>
    </div>
    <div style="{{p.labelStyle}}">{{p.label}}</div>
  </sc-for>
  <sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
    <div style="{{b.style}}">{{b.text}}</div>
  </sc-for>

  <div style="position: absolute; left: 180px; top: 342px; display: flex; align-items: center; gap: 4px;">
    <a href="SpotSheet.dc.html" aria-label="Three Friends Fishing Hole, spot guide" style="display: block; width: 28px; height: 38px;">
      <svg width="28" height="38" viewBox="-14 -36 28 38" aria-hidden="true"><path d="M0 0L-6.5 -10.5A13 13 0 1 1 6.5 -10.5Z" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"></path><path d="M-4.5 -27.5h9v10.5l-4.5 -2.9 -4.5 2.9z" fill="#1797ae"></path></svg>
    </a>
    <span style="font-size: 11px; line-height: 13px; font-weight: 600; text-shadow: 0 0 3px #1c1c1e, 0 0 3px #1c1c1e;">Three Friends Fishing Hole</span>
  </div>

  <div style="position: absolute; left: 8px; right: 8px; top: 54px; display: flex; flex-direction: column; gap: 8px;">
    <div style="height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 6px; background: rgba(44,44,46,0.92); border: 1px solid rgba(235,235,245,0.18); border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,0.5);">
      <button type="button" style="height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(235,235,245,0.18); background: transparent; color: #ffffff; font-size: 12px; font-weight: 600;">Reports</button>
      <button type="button" aria-label="Species: All species" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(235,235,245,0.18); background: transparent; color: #ffffff; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3-1.5V8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button>
      <button type="button" aria-label="My location" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(235,235,245,0.18); background: transparent; color: #ffffff; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-8A4.5 4.5 0 0 0 3.5 6.5c0 3.8 4.5 8 4.5 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><circle cx="8" cy="6.5" r="1.6" fill="currentColor"></circle></svg></button>
      <button type="button" aria-label="Report notice, newest report Oct 17" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,159,10,0.24); box-shadow: inset 0 0 0 1px rgba(255,159,10,0.55); color: #ffffff; display: grid; place-items: center;"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M8 6.2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
      <button type="button" style="height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(235,235,245,0.18); background: transparent; color: #ffffff; font-size: 12px; font-weight: 600;">Rivers</button>
      <a href="LayersMenu.dc.html" aria-label="Layers · 3" style="height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border-radius: 999px; border: 1px solid #4fc3dc; background: rgba(79,195,220,0.16); color: #ffffff; font-size: 12px; font-weight: 600; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14.5 5.5 8 9 1.5 5.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M1.5 8.5 8 12l6.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>3</a>
    </div>
    <div style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: rgba(44,44,46,0.92); border: 1px solid rgba(235,235,245,0.18); font-size: 12px; line-height: 16px; font-weight: 600;">Dashed pins: reports over a week old (newest Oct 17)</div>
    <div style="box-sizing: border-box; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(44,44,46,0.92); border: 1px solid rgba(235,235,245,0.18); border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,0.5);">
      <p style="margin: 0; font-size: 13px; line-height: 18px;"><b>2</b> seasons open in October 2026</p>
      <div role="radiogroup" aria-label="Season month" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px;">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="12">
          <button type="button" role="radio" aria-checked="{{m.on}}" aria-label="{{m.full}}" style="{{m.style}}">{{m.name}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; justify-content: space-between; align-items: flex-end;">
    <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(235,235,245,0.18); background: rgba(44,44,46,0.92); color: #ffffff; font: 600 14px/20px inherit;">Key</button>
    <div style="display: flex; flex-direction: column; background: rgba(44,44,46,0.92); border: 1px solid rgba(235,235,245,0.18); border-radius: 14px; overflow: hidden;">
      <button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; font-size: 20px;">+</button>
      <button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border: 0; border-top: 1px solid rgba(235,235,245,0.18); background: transparent; color: #ffffff; font-size: 20px;">−</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { prime: '#ff453a', good: '#ff9f0a', fair: '#ffd60a', slow: '#0a84ff', none: '#8e8e93' };
    var pins = [
      ['Cowlitz · Excellent', 'prime', 142.5, 539.6], ['Lower Columbia', 'prime', 69.7, 598.6], ['Kalama · Slow', 'slow', 117.8, 622],
      ['Lewis · Good', 'good', 147, 640], ['', 'good', 248.4, 678.1], ['', 'good', 267.1, 677.5],
      ['Klickitat', 'good', 321.4, 668.2], ['Washougal', 'none', 180.3, 701]
    ].map(function (p) {
      return {
        label: p[0], color: C[p[1]],
        pinStyle: 'position: absolute; left: ' + (p[2] - 14) + 'px; top: ' + (p[3] - 36) + 'px; width: 28px; height: 38px;',
        labelStyle: 'position: absolute; left: ' + (p[2] + 15) + 'px; top: ' + (p[3] - 31) + 'px; font-size: 11px; line-height: 13px; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px #1c1c1e, 0 0 3px #1c1c1e;'
      };
    });
    var badge = 'position: absolute; padding: 3px 8px; border-radius: 8px; background: rgba(28,28,30,0.97); border: 1px solid rgba(235,235,245,0.18); font-size: 11px; line-height: 14px; font-weight: 600; white-space: nowrap; ';
    var badges = [['10 kept', 152, 548], ['133 kept', 20, 606], ['45 kept', 157, 648], ['85 kept', 200, 690], ['53 kept', 300, 678], ['0 kept', 190, 708]]
      .map(function (b) { return { text: b[0], style: badge + 'left: ' + b[1] + 'px; top: ' + b[2] + 'px;' }; });
    var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var months = names.map(function (n, i) {
      var on = i === 9;
      return { name: n.slice(0, 3), full: n, on: on ? 'true' : 'false', style: 'min-height: 44px; padding: 0; border: 0; border-radius: 8px; font: 600 11px/14px inherit; ' + (on ? 'background: rgba(118,118,128,0.26); color: #ffffff; box-shadow: inset 0 0 0 1.5px #4fc3dc;' : 'background: transparent; color: rgba(235,235,245,0.74);') };
    });
    return { pins: pins, badges: badges, months: months };
  }
}
</script>
</body>
</html>
