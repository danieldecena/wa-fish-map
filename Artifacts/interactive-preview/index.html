<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WA Fish Map, interactive preview</title>
<style>
:root{
  --paper:#EDF2F1; --surface:#FFFFFF; --ink:#101A1C; --muted:#5B6A69; --line:#D3DEDC;
  --prime:#E4572E;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0C1315; --surface:#141E20; --ink:#E7EDEB; --muted:#93A3A2; --line:#243234;
}}
:root[data-theme="dark"]{
  --paper:#0C1315; --surface:#141E20; --ink:#E7EDEB; --muted:#93A3A2; --line:#243234;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
.wrap{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:24px 32px}
.stage{position:relative; width:100%; max-width:390px; margin:0 auto}
.screen{
  position:relative; width:100%; aspect-ratio:480/1044; border-radius:26px; overflow:hidden;
  border:1px solid var(--line); background:var(--surface); cursor:pointer;
}
.frame{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .18s}
.frame.is-on{opacity:1}
@media (prefers-reduced-motion:reduce){ .frame{transition:none} }
.hint{
  position:absolute; left:50%; transform:translateX(-50%); bottom:14px; z-index:3;
  background:rgba(16,26,28,.82); color:#fff; border-radius:999px; padding:7px 14px;
  font-size:.78rem; pointer-events:none;
}
.controls{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:18px}
.chip{
  font:inherit; font-size:.82rem; padding:7px 13px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
}
.chip.is-on{background:var(--prime); border-color:var(--prime); color:#fff}
.chip:focus-visible{outline:3px solid var(--prime); outline-offset:2px}
.label{
  text-align:center; margin:14px 0 0; font-size:.8rem; color:var(--muted);
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  letter-spacing:.06em; text-transform:uppercase;
}
.note{margin:18px auto 0; max-width:34em; text-align:center; font-size:.83rem; color:var(--muted)}
.back{
  display:none; margin:14px auto 0; font:inherit; font-size:.85rem; padding:8px 18px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); cursor:pointer;
}
.is-detail .back{display:block}
.is-detail .controls, .is-detail .label{display:none}
</style>
</head>

    });
    document.querySelectorAll(".chip").forEach(function (c) {
      c.classList.toggle("is-on", c.dataset.month === m);
    });
    label.textContent = "Ratings for " + months[m];
  }

  function openDetail() {
    screen.querySelectorAll(".frame[data-month]").forEach(function (f) { f.classList.remove("is-on"); });
    detail.classList.add("is-on");
    stage.classList.add("is-detail");
    hint.textContent = "Boston Harbor";
  }

  function closeDetail() {
    detail.classList.remove("is-on");
    stage.classList.remove("is-detail");
    hint.textContent = "Tap the map for a site card";
    showMonth(current);
  }

  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () { showMonth(c.dataset.month); });
  });
  screen.addEventListener("click", function () {
    if (!stage.classList.contains("is-detail")) openDetail();
  });
  screen.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); 
      stage.classList.contains("is-detail") ? closeDetail() : openDetail(); }
  });
  back.addEventListener("click", closeDetail);
  showMonth("7");
})();
</script>
</body>
</html>
