<style>
/* Layout concept: the WA Fish Map app's muted river map, full bleed. Glass chrome floats over it with a twelve-month ribbon as the one bold element: pick a month and every viewing site recolors on the app's timing ramp. Detail opens as a bottom sheet on phones and a trailing inspector on wide screens. */
:root {
  --ground: #f2f2f7;
  --surface: #ffffff;
  --sheet: rgba(255,255,255,0.97);
  --ink: #000000;
  --ink2: rgba(60,60,67,0.78);
  --fill-advisory: rgba(120,120,128,0.16);
  --fill-row: rgba(116,116,128,0.08);
  --fill-toggle: rgba(118,118,128,0.14);
  --glass: rgba(255,255,255,0.78);
  --glass-line: rgba(60,60,67,0.16);
  --river: rgba(0,124,158,0.42);
  --sea: rgba(0,124,158,0.12);
  --halo: #f2f2f7;
  --pin-edge: rgba(0,0,0,0.55);
  --on: #007c9e;
  --on-text: #00708f;
  --prime: #ff3b30;
  --good: #ff9500;
  --fair: #ffcc00;
  --slow: #007aff;
  --unrated: #8e8e93;
  --lift: 0 6px 22px rgba(0,0,0,0.14);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1c1c1e; --surface: #000000; --sheet: rgba(28,28,30,0.97); --ink: #ffffff; --ink2: rgba(235,235,245,0.74);
    --fill-advisory: rgba(120,120,128,0.32); --fill-row: rgba(118,118,128,0.24); --fill-toggle: rgba(118,118,128,0.26);
    --glass: rgba(44,44,46,0.76); --glass-line: rgba(235,235,245,0.18); --river: rgba(64,196,222,0.4); --sea: rgba(64,196,222,0.12);
    --halo: #1c1c1e; --pin-edge: rgba(255,255,255,0.95); --on-text: #4fc3dc;
    --prime: #ff453a; --good: #ff9f0a; --fair: #ffd60a; --slow: #0a84ff; --unrated: #98989d;
    --lift: 0 6px 22px rgba(0,0,0,0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1c1c1e; --surface: #000000; --sheet: rgba(28,28,30,0.97); --ink: #ffffff; --ink2: rgba(235,235,245,0.74);

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }

.r.o3 { stroke-width: 0.6px; opacity: 0.8; }
.r.o4 { stroke-width: 0.9px; }
.r.o5 { stroke-width: 1.3px; }
.r.o6 { stroke-width: 1.8px; }

#chrome {

.bar { align-self: flex-start; width: 100%; max-width: 480px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }

.brand .title { font-size: 17px; line-height: 22px; font-weight: 600; text-wrap: balance; }

.year { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }

.year .stack .p { background: var(--prime); }

.ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.summary { font-size: 13px; line-height: 18px; min-width: 0; flex: 1 1 200px; }
.summary b { font-variant-numeric: tabular-nums; }
.listbtn { border: 1px solid var(--glass-line); background: transparent; cursor: pointer; padding: 6px 14px; min-height: 40px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; }
.listbtn[aria-expanded="true"] { background: var(--on); border-color: var(--on); color: #fff; }

.bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.legend { padding: 10px 12px; max-width: 380px; flex: 1 1 auto; min-width: 0; }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend li { display: flex; align-items: center; gap: 5px; font-size: 11px; line-height: 13px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: block; }
.legend li.dash i { background: transparent; border: 1.5px dashed var(--ink2); }

.zoom { flex: none; display: flex; flex-direction: column; overflow: hidden; }
.zoom button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--glass-line); }
.zoom svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }

/* ---- sheet ---- */
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: min(68vh, 600px);
  display: flex; flex-direction: column; background: var(--sheet);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);

.head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.head p { margin: 0; color: var(--ink2); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 700; background: color-mix(in srgb, var(--c) 20%, transparent); border: 1px solid var(--c); white-space: nowrap; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; line-height: 16px; font-weight: 600; background: var(--fill-toggle); color: var(--ink2); white-space: nowrap; }
h3 { margin: 0 0 8px; font-size: 17px; line-height: 22px; font-weight: 600; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--fill-row); border-radius: 10px; padding: 10px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.row .rt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .nm { font-size: 15px; line-height: 20px; font-weight: 600; }
.row .dt { font-size: 12px; line-height: 16px; color: var(--ink2); }
.row .badge { padding: 3px 8px; flex: none; }
.miss { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink2); }
.note { margin: 0; font-size: 14px; line-height: 19px; }
.prov { margin: 0; font-size: 12px; line-height: 16px; color: var(--ink2); }

/* year grid in the sheet */
.cal { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; font-size: 11px; line-height: 13px; }
.cal th { font-weight: 600; color: var(--ink2); text-align: center; padding: 0 0 2px; }
.cal th.sp { text-align: left; width: 34%; color: var(--ink); font-size: 12px; line-height: 15px; padding-right: 4px; overflow-wrap: anywhere; }
.cal td { height: 18px; border-radius: 3px; background: var(--fill-row); }
.cal td.b { background: var(--prime); }
.cal td.g { background: var(--good); }
.cal td.f { background: var(--fair); }
.cal .cur { box-shadow: inset 0 0 0 2px var(--ink); }

.calkey span { display: inline-flex; align-items: center; gap: 4px; }
.calkey i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); display: block; }

.advisory { background: var(--fill-advisory); border-radius: 12px; padding: 12px; display: flex; gap: 10px; }
.advisory svg { flex: none; width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; margin-top: 1px; }

.advisory p { margin: 0; font-size: 14px; line-height: 19px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.dir { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--on); color: #fff; font-weight: 600; text-decoration: none; min-height: 44px; }

  function badge(v, text) { var tok = TOKEN[String(Math.max(v, -1))]; return '<span class="badge" style="--c:var(--' + tok + ')">' + esc(text) + '</span>'; }
  function showSheet(title, html, keep) {
    var sb = $('#sbody'), top = keep ? sb.scrollTop : 0;
    $('#stitle').textContent = title; sb.innerHTML = html; sb.scrollTop = top;
    if (!sheet.classList.contains('open')) {
      sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false'); app.classList.add('sheet-open');
      if (!keep) sheet.focus({ preventScroll: true });
    }
  }
  function closeSheet() {
    sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); app.classList.remove('sheet-open');
    var was = selected; selected = null; $('#listbtn').setAttribute('aria-expanded', 'false'); render();
    if (was && pins[was]) pins[was].g.focus({ preventScroll: true });
  }
  $('#sdone').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

  function calendar(s) {
    var head = '<tr><th class="sp" scope="col"><span class="sr">Species</span></th>' + MONTHS.map(function (m, i) { return '<th scope="col"' + (i + 1 === MONTH ? ' class="cur"' : '') + '><abbr title="' + m + '">' + m[0] + '</abbr></th>'; }).join('') + '</tr>';
    var body = s.sp.map(function (r) {
      var cells = MONTHS.map(function (m, i) {
        var v = rowScore(r, i + 1), cls = v === 3 ? 'b' : v === 2 ? 'g' : v === 1 ? 'f' : '';
        if (i + 1 === MONTH) cls += ' cur';
        return '<td class="' + cls.trim() + '"><span class="sr">' + m + ': ' + WORD[v] + '</span></td>';
      }).join('');
      return '<tr><th class="sp" scope="row">' + esc(r.label) + (r.odd ? ' <span class="sr">(odd years)</span>' : '') + '</th>' + cells + '</tr>';
    }).join('');
    return '<table class="cal"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
      '<div class="calkey"><span style="--c:var(--prime)"><i></i>Peak</span><span style="--c:var(--good)"><i></i>Active</span><span style="--c:var(--fair)"><i></i>Starting or ending</span></div>';
  }
  var SHIELD = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.2l6 2.3v4.6c0 4-2.5 6.7-6 8.2-3.5-1.5-6-4.2-6-8.2V4.5z"/><path d="M10 6.8v4M10 13.4v.1"/></svg>';
  var PROV = {
    site: 'Species and months come from the site’s own visitor information.',
    typical: 'WDFW lists this site without species or dates. These are the usual months for this water, so check locally before a long drive.',
    none: 'WDFW lists this site without saying which fish run here, so no months are shown.'
  };
  function openSite(id, keep) {
    var s = BYID[id]; if (!s) return;
    selected = id; $('#listbtn').setAttribute('aria-expanded', 'false');
    var sc = scores[id], mname = MONTHS[MONTH - 1];
    var ladder = s.kind === 'ladder';
    var head = '<div class="head"><p>' + esc(KIND[s.kind]) + ' · ' + esc(s.water) + ' · ' + esc(s.county) + ' County</p>' +
      (sc.v >= 0 ? badge(sc.v, WORD[sc.v] + ' in ' + mname + (sc.row ? ' · ' + sc.row.label : '')) : sc.v === -2 ? '<span class="chip">No ' + esc(family) + ' here</span>' : badge(-1, 'Species not listed')) + '</div>';
    var rows = s.sp.map(function (r) {
      var v = rowScore(r, MONTH);
      var months = 'Peak ' + r.best.map(function (m) { return MONTHS[m - 1].slice(0, 3); }).join(', ') + (r.good.length ? '; also ' + r.good.map(function (m) { return MONTHS[m - 1].slice(0, 3); }).join(', ') : '');
      var dt = offYear(r) ? 'Odd years only. Next run in ' + (YEAR + 1) + '.' : months + (r.odd ? '. Odd years only.' : '');
      return '<div class="row"><div class="rt"><div class="nm">' + esc(r.label) + '</div><div class="dt">' + esc(dt) + '</div></div>' + badge(v, WORD[v]) + '</div>';
    }).join('');
    var dir = 'https://maps.apple.com/?q=' + encodeURIComponent(s.name) + '&sll=' + s.lat + ',' + s.lon;
    var html = head +
      '<div class="acts"><a class="dir" href="' + dir + '" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14.5 1.5L1.5 6.8l5 1.7 1.7 5z"/></svg>Directions</a>' +
      '<a class="more" href="' + esc(s.url) + '" target="_blank" rel="noopener">Site info</a></div>' +
      (ladder ? '<div class="ladder">Fish pass this ladder on their way upstream. You see them through a window, but they don’t spawn here.</div>' : '') +
      (s.sp.length ? '<section><h3>In ' + mname + '</h3><div class="rows">' + rows + '</div></section>' +
        '<section><h3>Through the year</h3>' + calendar(s) + '</section>' : '') +
      (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') +
      '<p class="prov">' + esc(PROV[s.src]) + '</p>' +
      '<div class="advisory">' + SHIELD + '<div><h3>Before you go</h3><p>Stay out of the water and off the gravel where eggs are buried. Many spawning streams are closed to fishing, so check WDFW’s rules before you bring a rod.</p></div></div>' +
      '<div class="foot"><span>Typical timing, not a guarantee and not regulation. Runs shift with rain and water temperature.</span>' +
      '<a href="https://wdfw.wa.gov/places-to-go/salmon-viewing" target="_blank" rel="noopener">WDFW Salmon Viewing list</a></div>';
    showSheet(s.name, html, keep);
    render();
    if (!keep) {
      var x = s.xy[0] * v.s + v.tx, y = s.xy[1] * v.s + v.ty, p = pads();
      if (x < p.l + 20 || x > W - p.r - 20 || y < p.t + 40 || y > H - (window.innerWidth >= 760 ? p.b : H * 0.68) - 10) {
        var ns = Math.max(v.s, fitFor(SB, pads()).s * 2.2);
        var bottom = window.innerWidth >= 760 ? p.b : Math.min(H * 0.68, 600);
        animateTo({ s: ns, tx: (p.l + (W - p.l - p.r) / 2) - s.xy[0] * ns, ty: (p.t + (H - p.t - bottom) / 2) - s.xy[1] * ns }, 320);
      }
    }
  }
  function openList(keep) {
    selected = null; $('#listbtn').setAttribute('aria-expanded', 'true');
    var mname = MONTHS[MONTH - 1], groups = { 3: [], 2: [], 1: [], 0: [], '-1': [] };
    SITES.forEach(function (s) { var sc = scores[s.id]; if (sc.v === -2) return; groups[String(Math.max(sc.v, -1))].push(s); });
    var html = '<p class="lede">' + (family ? esc(family) + ' sites' : 'All ' + SITES.length + ' sites') + ' in ' + mname + ', best first. Pick a month at the top to see another time of year.</p>';
    ['3', '2', '1', '0', '-1'].forEach(function (k) {
      var list = groups[k]; if (!list.length) return;
      list.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
      html += '<section class="lgroup"><h3>' + WORD[k] + ' <span class="n">' + list.length + '</span></h3><div class="rows">' + list.map(function (s) {
        var sc = scores[s.id], what = sc.row ? sc.row.label : (s.sp.length ? s.sp.map(function (r) { return r.label; }).filter(function (x, i, a) { return a.indexOf(x) === i; }).slice(0, 2).join(', ') : 'Species not listed');
        return '<button type="button" class="row lrow" data-open="' + s.id + '" style="--c:var(--' + TOKEN[k] + ')"><span class="dot"></span><span class="rt"><span class="nm">' + esc(s.name) + '</span><span class="dt">' + esc(what) + ' · ' + esc(s.county) + ' County' + (s.kind === 'ladder' ? ' · fish ladder' : '') + '</span></span></button>';
      }).join('') + '</div></section>';
    });
    html += '<div class="foot"><span>From WDFW’s Salmon Viewing list. Species and months are typical for each water unless a site’s own information says otherwise.</span><a href="https://wdfw.wa.gov/places-to-go/salmon-viewing" target="_blank" rel="noopener">WDFW Salmon Viewing list</a></div>';
    showSheet('Sites in ' + mname, html, keep);
    render();
  }
  $('#sbody').addEventListener('click', function (e) { var b = e.target.closest('[data-open]'); if (b) openSite(b.getAttribute('data-open')); });
  $('#listbtn').addEventListener('click', function () {
    if (sheet.classList.contains('open') && selected === null) closeSheet(); else openList();
  });

  /* ---- boot ---- */
  function boot() {
    size(); limits(); applyStyles(); paintChrome();
    var f = fitFor(SB, pads()); v.s = f.s; v.tx = f.tx; v.ty = f.ty; clampView(v); render();
  }
  window.addEventListener('resize', function () { var c = { x: (W / 2 - v.tx) / v.s, y: (H / 2 - v.ty) / v.s }; size(); limits(); paintChrome(); setView({ s: v.s, tx: W / 2 - c.x * v.s, ty: H / 2 - c.y * v.s }); });
  boot();
})();
</script>

</body></html>
