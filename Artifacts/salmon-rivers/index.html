<title>Washington Fishing Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: a full-bleed, muted river map in the WA Fish Map app's language. Glass chrome floats over it; detail opens as a bottom sheet on phones and a trailing inspector on wide screens. */
:root {
  --ground: #f2f2f7;
  --surface: #ffffff;
  --sheet: rgba(255,255,255,0.97);
  --ink: #000000;
  --ink2: rgba(60,60,67,0.78);
  --fill-advisory: rgba(120,120,128,0.16);
  --fill-row: rgba(116,116,128,0.08);
  --fill-toggle: rgba(118,118,128,0.14);
  --glass: rgba(255,255,255,0.76);
  --glass-line: rgba(60,60,67,0.16);
  --river: rgba(0,124,158,0.42);
  --halo: #f2f2f7;
  --pin-edge: rgba(0,0,0,0.55);
  --on: #007c9e;
  --on-text: #00708f;
  --prime: #ff3b30;
  --good: #ff9500;
  --fair: #ffcc00;
  --slow: #007aff;
  --unrated: #8e8e93;
  --cluster: #ffffff;
  --land: #fcfcfd;
  --state-line: rgba(60,60,67,0.6);
  --brand-a: #1797ae;
  --brand-b: #004a79;
  --lift: 0 6px 22px rgba(0,0,0,0.14);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1c1c1e;
    --surface: #000000;
    --sheet: rgba(28,28,30,0.97);
    --ink: #ffffff;
    --ink2: rgba(235,235,245,0.74);
    --fill-advisory: rgba(120,120,128,0.32);
    --fill-row: rgba(118,118,128,0.24);
    --fill-toggle: rgba(118,118,128,0.26);
    --glass: rgba(44,44,46,0.74);
    --glass-line: rgba(235,235,245,0.18);
    --river: rgba(64,196,222,0.4);
    --halo: #1c1c1e;
    --pin-edge: rgba(255,255,255,0.95);
    --on-text: #4fc3dc;
    --prime: #ff453a;
    --good: #ff9f0a;
    --fair: #ffd60a;
    --slow: #0a84ff;
    --cluster: #2c2c2e;
    --land: #262629;
    --state-line: rgba(235,235,245,0.5);
    --lift: 0 6px 22px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1c1c1e;
  --surface: #000000;
  --sheet: rgba(28,28,30,0.97);
  --ink: #ffffff;
  --ink2: rgba(235,235,245,0.74);
  --fill-advisory: rgba(120,120,128,0.32);
  --fill-row: rgba(118,118,128,0.24);
  --fill-toggle: rgba(118,118,128,0.26);
  --glass: rgba(44,44,46,0.74);
  --glass-line: rgba(235,235,245,0.18);
  --river: rgba(64,196,222,0.4);
  --halo: #1c1c1e;
  --pin-edge: rgba(255,255,255,0.95);
  --on-text: #4fc3dc;
  --prime: #ff453a;
  --good: #ff9f0a;
  --fair: #ffd60a;
  --slow: #0a84ff;
  --cluster: #2c2c2e;
  --land: #262629;
  --state-line: rgba(235,235,245,0.5);
  --lift: 0 6px 22px rgba(0,0,0,0.5);
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--on-text); }
:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }

/* ---- map ---- */
#map { position: absolute; inset: 0; overflow: hidden; background: var(--ground); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.drag { cursor: grabbing; }
#map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#over { pointer-events: none; }
.r { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.r.o2 { stroke-width: 0.5px; opacity: 0.75; }
.r.o3 { stroke-width: 0.7px; }
.r.o4 { stroke-width: 1px; }
.r.o5 { stroke-width: 1.4px; }
.r.o6 { stroke-width: 1.9px; }
.r.o7 { stroke-width: 2.5px; }
.hl path { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.hl .casing { stroke: var(--halo); stroke-width: 7px; opacity: 0.92; }
.hl .line { stroke: var(--rc); stroke-width: 3.6px; }
.hl .hit { stroke: transparent; stroke-width: 24px; pointer-events: stroke; cursor: pointer; }
.hl.closed .line { opacity: 0.55; }
.hl.sel .line { stroke-width: 5px; }

.pin { pointer-events: auto; cursor: pointer; outline: none; }
.pin .balloon { fill: var(--rc); stroke: var(--pin-edge); stroke-width: 1.5; }
.pin .glyph path { fill: var(--gl, #fff); }
.pin .tipshadow { fill: rgba(0,0,0,0.28); }
.pin.closed .pin-s { opacity: 0.55; }
.pin:focus-visible .balloon { stroke: var(--on); stroke-width: 3; }
.cluster { pointer-events: auto; cursor: pointer; outline: none; }
.cluster circle { fill: var(--rc); stroke: var(--pin-edge); stroke-width: 2; }
.cluster text { fill: var(--gl, #fff); font: 700 11px/13px var(--sans); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
.cluster.neutral circle { fill: var(--cluster); }
.cluster.neutral text { fill: var(--ink); }
.cluster:focus-visible circle { stroke: var(--on); stroke-width: 3; }

.lab { font: 600 11px/13px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.2px; stroke-linejoin: round; }
.lab.city { font-weight: 500; fill: var(--ink2); }
.lab.peak, .lab.dam { font-weight: 500; fill: var(--ink2); }
.lab.water { font-style: italic; font-weight: 500; fill: var(--on-text); letter-spacing: 0.04em; text-anchor: middle; }
.lab.region { font-weight: 600; letter-spacing: 0.32em; fill: var(--ink2); opacity: 0.6; text-anchor: middle; font-size: 10px; }
.lm-dot { fill: var(--ink2); stroke: var(--halo); stroke-width: 1.5; }
.lm-peak { fill: var(--ink2); stroke: var(--halo); stroke-width: 1.2; }
.lm-dam { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.5; }

/* ---- chrome ---- */
#chrome {
  position: absolute; inset: 0; pointer-events: none;
  /* GlassCard: the card floats inset 8 px on compact width and 12 px on regular width (tokens.json space-8, space-12). */
  padding-block: 8px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
}
@media (min-width: 760px) {
  #chrome { padding-block: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 12px; }
}
#chrome > * { pointer-events: auto; }
/* The bottom row spans the screen but only the legend and zoom buttons are chrome: the map under the rest must still take taps and drags. */
#chrome > .bottom { pointer-events: none; }
.bottom > * { pointer-events: auto; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.8) blur(20px);
  backdrop-filter: saturate(1.8) blur(20px);
  border: 1px solid var(--glass-line);
  border-radius: 14px;
  box-shadow: var(--lift);
}
.bar { align-self: flex-start; width: 100%; max-width: 460px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand .t { min-width: 0; flex: 1 1 auto; }
.brand .listbtn { flex: none; margin-left: auto; align-self: flex-start; }
.brand .title { font-size: 17px; line-height: 22px; font-weight: 600; text-wrap: balance; }
.brand .sub { font-size: 12px; line-height: 16px; color: var(--ink2); }
.hint { margin: -4px 2px 0; font-size: 12px; line-height: 16px; color: var(--ink2); }
.notice { font-size: 12px; line-height: 16px; background: var(--fill-advisory); border-radius: 10px; padding: 8px 10px; }
@media (max-width: 759px) { #app.sheet-open .notice { display: none; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 0; cursor: pointer; padding: 0 14px; min-height: 44px; border-radius: 999px; background: var(--fill-toggle); font-size: 12px; line-height: 16px; font-weight: 600; }
.seg button[aria-checked="true"] { background: var(--on); color: #fff; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.listbtn { border: 1px solid var(--glass-line); background: transparent; cursor: pointer; padding: 6px 14px; min-height: 44px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; }
.listbtn[aria-expanded="true"] { background: var(--on); border-color: var(--on); color: #fff; }
.lrow { border: 0; width: 100%; text-align: left; cursor: pointer; min-height: 44px; font: inherit; color: inherit; }
.lede { margin: 0 0 10px; font-size: 12px; line-height: 16px; color: var(--ink2); }
.modes button { flex: 1 1 auto; }
#spbtn { text-align: left; max-width: 100%; }
.sppanel { max-height: min(40vh, 300px); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
.sppanel .gl { margin: 0 0 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink2); }
.row.sel { outline: 2px solid var(--on); outline-offset: -2px; }
.row .sub2 { font-size: 12px; line-height: 16px; color: var(--ink2); }
#app.typ .hl { display: none; }
/* One basemap for both modes: a light land tint inside Washington, WDFW salt water over it, the state outline, then rivers. */
#tbase .l { fill: var(--land); stroke: none; }
#tbase .w0 { fill: var(--ground); fill-rule: evenodd; stroke: none; }
#tbase .w { fill: var(--river); fill-opacity: 0.35; fill-rule: evenodd; stroke: var(--river); stroke-width: 0.7px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#tbase .o { fill: none; stroke: var(--state-line); stroke-width: 1.2px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

.bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.legend { padding: 10px 12px; max-width: 360px; flex: 1 1 auto; min-width: 0; }
.legend .lt { font-size: 12px; line-height: 16px; font-weight: 600; margin-bottom: 6px; }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend li { display: flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; }
.legend li.fade i { opacity: 0.55; }
.legend li.cl i { box-shadow: inset 0 0 0 1px var(--pin-edge); }
.legend .fine { margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--ink2); }
.zoom { flex: none; display: flex; flex-direction: column; overflow: hidden; }
.zoom button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--glass-line); }
.zoom svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }

/* ---- detail sheet ---- */
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: min(66vh, 580px);
  display: flex; flex-direction: column;
  background: var(--sheet);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
  border-top: 1px solid var(--glass-line);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
  transform: translateY(104%); visibility: hidden;
  transition: transform 0.28s cubic-bezier(.2,.8,.2,1), visibility 0s 0.28s;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 5;
}
#sheet.open { transform: none; visibility: visible; transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
.sbar {
  position: relative; flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--glass-line);
  background: var(--sheet);
}
.sbar .grab { position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--fill-advisory); }
.sbar .st { margin: 6px 0 0; font-size: 15px; line-height: 20px; font-weight: 600; }
.sbar button { margin-top: 6px; border: 0; background: transparent; color: var(--on-text); font-weight: 600; cursor: pointer; padding: 0 4px; min-height: 44px; }
#sheet:focus { outline: none; }
.sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.head p { margin: 0; color: var(--ink2); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 700; background: color-mix(in srgb, var(--c) 20%, transparent); border: 1px solid var(--c); white-space: nowrap; }
.badge.faded { opacity: 0.7; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; background: var(--fill-toggle); color: var(--ink2); white-space: nowrap; }
.chip.old { outline: 1px dashed var(--ink2); outline-offset: -1px; }
h3 { margin: 0 0 8px; font-size: 17px; line-height: 22px; font-weight: 600; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--fill-row); border-radius: 10px; padding: 10px; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.row .rt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .nm { font-size: 15px; line-height: 20px; font-weight: 600; }
.miss { margin: 0 0 8px; font-size: 13px; line-height: 18px; color: var(--ink2); }
.row .dt { font-size: 12px; line-height: 16px; color: var(--ink2); }
.row .ch { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.creel { background: var(--fill-row); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.creel .ctop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 10px; }
.creel .ctop span.wk { font-size: 12px; line-height: 16px; color: var(--ink2); }
.creel a.csrc { display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; font-weight: 600; }
.ctab { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; font-variant-numeric: tabular-nums; }
.ctab th, .ctab td { padding: 5px 0 5px 8px; text-align: right; vertical-align: top; }
.ctab th:first-child, .ctab td:first-child { padding-left: 0; text-align: left; }
.ctab thead th { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink2); border-bottom: 1px solid var(--glass-line); }
.ctab tbody th { font-weight: 400; }
.ctab tr.grp th { padding-top: 10px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink2); text-align: left; }
.creel .cnote { margin: 0; font-size: 12px; line-height: 16px; color: var(--ink2); }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.advisory { background: var(--fill-advisory); border-radius: 12px; padding: 12px; display: flex; gap: 10px; }
.advisory svg { flex: none; width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; margin-top: 1px; }
.advisory h3 { margin-bottom: 2px; }
.advisory p { margin: 0; font-size: 14px; line-height: 19px; }
.dir { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--on); color: #fff; font-weight: 600; text-decoration: none; min-height: 44px; }
.dir svg { width: 16px; height: 16px; fill: #fff; }
.foot { display: flex; flex-direction: column; gap: 8px; font-size: 12px; line-height: 16px; color: var(--ink2); }
.foot a { color: var(--ink2); }
.foot .src { display: flex; flex-wrap: wrap; gap: 2px 12px; }

@media (min-width: 760px) {
  .bar { max-width: 460px; }
  #sheet {
    left: auto; right: 12px; top: 12px; bottom: 12px; width: 380px; max-height: none;
    border: 1px solid var(--glass-line); border-radius: 14px;
    transform: translateX(112%);
    padding-bottom: 0;
  }
  #sheet.open { transform: none; }
  .sbar { border-radius: 14px 14px 0 0; padding-right: 16px; padding-left: 16px; }
  .sbar .grab { display: none; }
  .sbar .st { margin-top: 0; }
  .sbar button { margin-top: 0; }
  .sbody { padding-right: 16px; padding-left: 16px; }
  .zoom { transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
  #app.sheet-open .zoom { transform: translateX(-392px); }
}
@media (max-width: 759px) {
  #app.sheet-open .bottom { visibility: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  #sheet, #sheet.open, .zoom { transition: none; }
}
</style>

<div id="app">
  <div id="map" role="application" aria-label="Map of salmon rivers in southwest Washington. Drag to pan, pinch or use the buttons to zoom, select a river marker for details.">
    <svg id="base" aria-hidden="true"><g id="vp"></g></svg>
    <svg id="over"></svg>
  </div>

  <div id="chrome">
    <div class="glass bar" id="bar">
      <div class="brand">
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1797ae"/><stop offset="1" stop-color="#004a79"/></linearGradient></defs>
          <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
          <path fill="#fff" d="M456.70 512.00L194.56 389.12L194.56 634.88Z"/>
          <path fill="#fff" fill-rule="evenodd" d="M337.92 512.00C501.76 386.39 665.60 386.39 829.44 512.00C665.60 637.61 501.76 637.61 337.92 512.00ZM767.18 503.81C767.18 488.43 754.71 475.96 739.33 475.96C723.95 475.96 711.48 488.43 711.48 503.81C711.48 519.19 723.95 531.66 739.33 531.66C754.71 531.66 767.18 519.19 767.18 503.81Z"/>
        </svg>
        <div class="t">
          <div class="title" id="ttl">Salmon this month</div>
          <div class="sub" id="sub"></div>

        <button type="button" class="listbtn" id="listbtn" aria-expanded="false" aria-controls="sheet">Rivers</button>
      </div>
      <div class="seg modes" id="modes" role="radiogroup" aria-label="Map mode">
        <button type="button" role="radio" aria-checked="true" data-mode="reports">Recent reports</button>
        <button type="button" role="radio" aria-checked="false" data-mode="typical">Typical season</button>

        <button type="button" class="listbtn" id="spbtn" aria-expanded="false" aria-controls="sppanel"></button>

    <div class="bottom" id="bottom">
      <div class="glass legend" id="legend">
        <div class="lt" id="legt">Recent catch reports</div>
        <ul id="legl">
          <li style="--c:var(--prime)"><i></i>Excellent</li>
          <li style="--c:var(--good)"><i></i>Good</li>
          <li style="--c:var(--fair)"><i></i>Fair</li>
          <li style="--c:var(--slow)"><i></i>Slow</li>
          <li class="fade" style="--c:var(--prime)"><i></i>Faded: release only</li>
          <li class="cl" style="--c:var(--cluster)"><i></i>Count: several sites</li>
        </ul>
        <div class="fine" id="legf">Catch reports, not season dates. Confirm rules on WDFW.</div>
      </div>
      <div class="glass zoom">
        <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 18 18"><path d="M9 3v12M3 9h12"/></svg></button>
        <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 18 18"><path d="M3 9h12"/></svg></button>
        <button type="button" id="zfit" aria-label="Reset view"><svg viewBox="0 0 18 18"><path d="M3 6.5V3h3.5M11.5 3H15v3.5M15 11.5V15h-3.5M6.5 15H3v-3.5"/></svg></button>
      </div>
    </div>
  </div>

  <aside id="sheet" aria-labelledby="stitle" tabindex="-1" aria-hidden="true">
    <div class="sbar"><span class="grab"></span><h2 class="st" id="stitle"></h2><button type="button" id="sdone">Done</button></div>
    <div class="sbody" id="sbody"></div>
  </aside>
</div>

<script>
(function () {
  'use strict';

    if (wide) { tx = (W - 392) / 2 - s.xy[0] * ns; ty = H / 2 + 20 - s.xy[1] * ns; }
    else { tx = W / 2 - s.xy[0] * ns; ty = (barB + (H - Math.min(sh, H * 0.66))) / 2 + 24 - s.xy[1] * ns; }
    animateTo({ s: ns, tx: tx, ty: ty }, 320);
  }
  function openList() {
    selected = null; mode = 'list';
    fillList();
    showSheet();
    $('#listbtn').setAttribute('aria-expanded', 'true');
    applyStyles(); render();
  }
  function closeSheet() {
    selected = null; mode = null;
    // Focus leaves the sheet before it is hidden from assistive technology, or the browser blocks aria-hidden on a focused element.
    if (sheet.contains(document.activeElement)) document.activeElement.blur();
    sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    appEl.classList.remove('sheet-open');
    $('#listbtn').setAttribute('aria-expanded', 'false');
    applyStyles(); render();
    var back = returnFocus; returnFocus = null;
    if (back && back !== document.body && document.contains(back) && back.focus) back.focus({ preventScroll: true });
  }
  $('#sdone').addEventListener('click', closeSheet);
  $('#listbtn').addEventListener('click', function () { if (mode === 'list') closeSheet(); else openList(); });
  $('#sbody').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.lrow') : null;
    if (b) openSheet(b.getAttribute('data-id'));
  });
  window.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!sppanel.hidden) { toggleSpecies(false); spbtn.focus({ preventScroll: true }); return; }
    if (mode) closeSheet();
  });

  /* ---- mode ---- */
  function setMode(m) {
    // The ?mode=typical link comes through here too: without typical.js or season.js there is nothing to switch to.
    if (m === view || (m === 'typical' && !HAS_TYPICAL)) return;
    view = m; species = null; selected = null;
    if (mode) closeSheet();
    appEl.classList.toggle('typ', m === 'typical');
    document.querySelectorAll('#modes button').forEach(function (b) { b.setAttribute('aria-checked', b.getAttribute('data-mode') === m ? 'true' : 'false'); });
    var typ = m === 'typical';
    if (typ) initTypical();
    $('#ttl').textContent = typ ? 'Typical season' : 'Salmon this month';
    $('#sub').textContent = typ ? 'Washington piers, boat launches and shore access · ' + Season.MONTHS[MONTH - 1]
      : 'Southwest Washington · reports through ' + Reports.formatDay(Reports.latestReport(SITES));
    $('#legt').textContent = typ ? 'Typical timing, ' + Season.MONTHS[MONTH - 1] : 'Recent catch reports';
    $('#legl').innerHTML = typ
      ? '<li style="--c:var(--prime)"><i></i>Prime</li><li style="--c:var(--good)"><i></i>Good</li><li style="--c:var(--fair)"><i></i>Fair</li><li style="--c:var(--slow)"><i></i>Slow</li><li style="--c:var(--unrated)"><i></i>No seasonal guidance</li><li class="fade" style="--c:var(--prime)"><i></i>Faded: season often varies</li><li class="cl" style="--c:var(--cluster)"><i></i>Count: several sites</li>'
      : '<li style="--c:var(--prime)"><i></i>Excellent</li><li style="--c:var(--good)"><i></i>Good</li><li style="--c:var(--fair)"><i></i>Fair</li><li style="--c:var(--slow)"><i></i>Slow</li><li class="fade" style="--c:var(--prime)"><i></i>Faded: release only</li><li class="cl" style="--c:var(--cluster)"><i></i>Count: several sites</li>';
    $('#legf').textContent = typ ? TYPICAL_LINE + ' Confirm rules on WDFW.' : 'Catch reports, not season dates. Confirm rules on WDFW.';
    var n = typ ? TYPICAL_LINE : Reports.staleNotice(SITES, TODAY);
    $('#notice').textContent = n || ''; $('#notice').hidden = !n;
    map.setAttribute('aria-label', typ
      ? 'Map of Washington piers, boat launches and shore access sites colored by typical seasonal timing. Drag to pan, pinch or use the buttons to zoom, select a marker for details.'
      : 'Map of salmon rivers in southwest Washington. Drag to pan, pinch or use the buttons to zoom, select a river marker for details.');
    buildSpecies();
    applyStyles();
    limits();
    var f = homeFit(); s0 = f.s;
    if (reduce) setView(f); else animateTo(f, 350);
    render();
  }

  /* ---- boot ---- */
  function init() {
    size(); limits();
    var f = homeFit();
    s0 = f.s;
    applyStyles();
    setView(f);
  }
  var ro = window.ResizeObserver ? new ResizeObserver(function () {
    var wasS = v.s / s0;
    size(); limits();
    var f = homeFit(); s0 = f.s;
    if (Math.abs(wasS - 1) < 0.01) setView(f); else setView({ s: v.s, tx: v.tx, ty: v.ty });
  }) : null;
  if (ro) ro.observe(map); else window.addEventListener('resize', function () { size(); limits(); render(); });
  buildSpecies();
  var notice = Reports.staleNotice(SITES, TODAY);
  if (notice) { $('#notice').textContent = notice; $('#notice').hidden = false; }
  $('#sub').textContent = 'Southwest Washington · reports through ' + Reports.formatDay(Reports.latestReport(SITES));
  init();
  // ?mode=typical opens the page in Typical season (a shareable link); anything else keeps Recent reports.
  if (/[?&]mode=typical(&|$)/.test(location.search)) setMode('typical');
})();
</script>
