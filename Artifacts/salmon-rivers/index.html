    return { name: r[0], xy: xy(r[2], r[1]), kind: kind, pr: r[4], g: g, t: t, shape: shape, w: 0 };
  });
  lms.sort(function (a, b) { return a.pr - b.pr; });

  var pinNodes = {};
  SITES.forEach(function (s) {
    var g = el('g', { 'class': 'pin', 'data-id': s.id, tabindex: '0', role: 'button' }, over);
    var sc = el('g', { 'class': 'pin-s' }, g);
    el('ellipse', { 'class': 'tipshadow', cx: 0, cy: 0, rx: 6, ry: 2.2 }, sc);
    el('circle', { r: 26, cy: -16, fill: 'transparent' }, sc);
    el('path', { 'class': 'balloon', d: 'M0 0L-6.5 -10.5A13 13 0 1 1 6.5 -10.5Z' }, sc);
    var gl = el('g', { 'class': 'glyph', transform: 'translate(0 -21.8) scale(.0225) translate(-512 -512)' }, sc);
    el('path', { d: BODY, 'fill-rule': 'evenodd' }, gl);
    el('path', { d: TAIL }, gl);
    var lab = el('text', { 'class': 'lab' }, over);
    lab.textContent = s.name.replace(' River', '');
    pinNodes[s.id] = { g: g, sc: sc, lab: lab, w: 0 };
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(s.id); } });
  });

  var clusterPool = [];
  function getCluster(i) {
    if (clusterPool[i]) return clusterPool[i];
    var g = el('g', { 'class': 'cluster', tabindex: '0', role: 'button' }, over);
    el('circle', { r: 15, cy: -15 }, g);
    var t = el('text', { y: -15 }, g);
    var o = { g: g, t: t };
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoomToCluster(g); } });
    clusterPool[i] = o;
    return o;
  }

  // measure label widths once
  lms.forEach(function (l) { l.w = l.t.getBBox().width; });
  SITES.forEach(function (s) { pinNodes[s.id].w = pinNodes[s.id].lab.getBBox().width; });

  /* ---- view state ---- */
  var map = $('#map');
  var W = 0, H = 0;
  var v = { s: 1, tx: 0, ty: 0 };
  var minS = 1, maxS = 100, s0 = 1;
  var anim = null;

  function size() { var r = map.getBoundingClientRect(); W = r.width; H = r.height; }
  function pads() {
    var barB = $('#bar').getBoundingClientRect().bottom + 10;
    var legT = $('#legend').getBoundingClientRect().top;
    var wide = window.innerWidth >= 760;
    var sheetOpen = $('#sheet').classList.contains('open');
    return { t: barB, b: Math.max(24, H - legT + 10), l: 16, r: (wide && sheetOpen) ? 400 : 16 };
  }
  function fitFor(b, p) {
    var x0 = b[0][0], y0 = b[0][1], x1 = b[1][0], y1 = b[1][1];
    var aw = Math.max(40, W - p.l - p.r), ah = Math.max(40, H - p.t - p.b);
    var s = Math.min(aw / (x1 - x0), ah / (y1 - y0));
    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return { s: s, tx: p.l + aw / 2 - cx * s, ty: p.t + ah / 2 - cy * s };
  }
  function clampView(t) {
    var sb = D.bounds.state;
    var cx = (W / 2 - t.tx) / t.s, cy = (H / 2 - t.ty) / t.s;
    var m = 40;
    cx = Math.min(Math.max(cx, sb[0][0] - m), sb[1][0] + m);
    cy = Math.min(Math.max(cy, sb[0][1] - m), sb[1][1] + m);
    t.tx = W / 2 - cx * t.s; t.ty = H / 2 - cy * t.s;
    return t;
  }
  function limits() {
    var f = fitFor(D.bounds.state, { t: 0, b: 0, l: 0, r: 0 });
    minS = f.s * 0.9; maxS = f.s * 90;
  }
  function setView(t) {
    t.s = Math.min(Math.max(t.s, minS), maxS);
    clampView(t);
    v.s = t.s; v.tx = t.tx; v.ty = t.ty;
    render();
  }
  function animateTo(t, ms) {
    t.s = Math.min(Math.max(t.s, minS), maxS);
    clampView(t);
    if (reduce) { setView(t); return; }
    var a = { s: v.s, tx: v.tx, ty: v.ty }, t0 = performance.now();
    var token = {}; anim = token;
    (function step(now) {
      if (anim !== token) return;
      var k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      var s = a.s * Math.pow(t.s / a.s, e);
      // interpolate the map-space center so the move stays smooth while zooming
      var acx = (W / 2 - a.tx) / a.s, acy = (H / 2 - a.ty) / a.s;
      var bcx = (W / 2 - t.tx) / t.s, bcy = (H / 2 - t.ty) / t.s;
      var cx = acx + (bcx - acx) * e, cy = acy + (bcy - acy) * e;
      v.s = s; v.tx = W / 2 - cx * s; v.ty = H / 2 - cy * s;
      render();
      if (k < 1) requestAnimationFrame(step); else anim = null;
    })(t0);
  }
  function zoomAt(px, py, k) {
    var ns = Math.min(Math.max(v.s * k, minS), maxS); k = ns / v.s;
    setView({ s: ns, tx: px - (px - v.tx) * k, ty: py - (py - v.ty) * k });
  }
  function resetView() { animateTo(fitFor(D.bounds.sw, pads()), 350); }

  /* ---- render ---- */
  function colorVar(r) { return 'var(--' + r + ')'; }
  function applyStyles() {
    SITES.forEach(function (s) {
      var vw = viewOf(s);
      var pn = pinNodes[s.id];
      pn.g.style.setProperty('--rc', colorVar(vw.r));
      pn.g.style.setProperty('--gl', vw.r === 'fair' ? 'rgba(0,0,0,0.72)' : '#fff');
      pn.g.classList.toggle('closed', vw.release);
      pn.g.setAttribute('aria-label', s.name + ', ' + LABEL[vw.r].toLowerCase() + ' reports' + (vw.k ? ' for ' + SP_NAME[vw.k].toLowerCase() : '') + (vw.release ? ', release only' : ''));
      var h = hlNodes[s.id];
      if (h) { h.style.setProperty('--rc', colorVar(vw.r)); h.classList.toggle('closed', vw.release); h.classList.toggle('sel', selected === s.id); }
    });
  }
  function overlap(a, b) { return a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1]; }

  function render() {
    vp.setAttribute('transform', 'translate(' + v.tx + ' ' + v.ty + ') scale(' + v.s + ')');
    var pts = SITES.map(function (s) {
      return { s: s, x: s.xy[0] * v.s + v.tx, y: s.xy[1] * v.s + v.ty, vw: viewOf(s) };
    });
    pts.sort(function (a, b) {
      var ra = RANK[a.vw.r] - (a.vw.release ? 10 : 0), rb = RANK[b.vw.r] - (b.vw.release ? 10 : 0);
      return rb - ra;
    });
    var used = {}, groups = [];
    pts.forEach(function (p) {
      if (used[p.s.id]) return;
      var g = [p]; used[p.s.id] = 1;
      if (p.s.id !== selected) {
        pts.forEach(function (q) {
          if (used[q.s.id] || q.s.id === selected) return;
          if (Math.hypot(p.x - q.x, p.y - q.y) < 30) { g.push(q); used[q.s.id] = 1; }
        });
      }
      groups.push(g);
    });
    var boxes = [];
    var ci = 0;
    SITES.forEach(function (s) { pinNodes[s.id].g.style.display = 'none'; pinNodes[s.id].lab.style.display = 'none'; });
    clusterPool.forEach(function (c) { c.g.style.display = 'none'; });
    groups.forEach(function (g) {
      if (g.length === 1) {
        var p = g[0], pn = pinNodes[p.s.id];
        var sc = p.s.id === selected ? 0.98 : 0.8;
        pn.g.style.display = '';
        pn.g.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') scale(' + sc + ')');
        boxes.push([p.x - 15, p.y - 36, 30, 38]);
      } else {
        var cx = 0, cy = 0; g.forEach(function (m) { cx += m.x; cy += m.y; }); cx /= g.length; cy /= g.length;
        var c = getCluster(ci++);
        c.g.style.display = '';
        c.g.setAttribute('transform', 'translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ') scale(0.95)');
        c.g.style.setProperty('--rc', colorVar(g[0].vw.r));
        c.g.style.setProperty('--gl', g[0].vw.r === 'fair' ? 'rgba(0,0,0,0.72)' : '#fff');
        c.t.textContent = g.length;
        c.g.setAttribute('data-cluster', g.map(function (m) { return m.s.id; }).join(','));
        c.g.setAttribute('aria-label', g.length + ' rivers close together, zoom in');
        boxes.push([cx - 16, cy - 34, 32, 36]);
      }
    });
    // pin labels first, then landmarks by priority
    groups.forEach(function (g) {
      if (g.length !== 1) return;
      var p = g[0], pn = pinNodes[p.s.id];
      var bx = [p.x + 15, p.y - 30, pn.w + 4, 14];
      var hit = boxes.some(function (b) { return overlap(bx, b); });
      if (!hit) {
        pn.lab.style.display = '';
        pn.lab.setAttribute('x', (p.x + 15).toFixed(1)); pn.lab.setAttribute('y', (p.y - 19).toFixed(1));
        boxes.push(bx);
      }
    });
    lms.forEach(function (l) {
      var x = l.xy[0] * v.s + v.tx, y = l.xy[1] * v.s + v.ty;
      var show = x > -80 && x < W + 80 && y > -20 && y < H + 20;
      if (show) {
        var bx = l.kind === 'water' || l.kind === 'region'
          ? [x - l.w / 2, y - 8, l.w, 14]
          : [x - 4, y - 8, l.w + 14, 15];
        show = !boxes.some(function (b) { return overlap(bx, b); });
        if (show) boxes.push(bx);
      }
      l.g.style.display = show ? '' : 'none';
      if (show) {
        l.g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
        if (l.kind === 'water' || l.kind === 'region') { l.t.setAttribute('x', 0); l.t.setAttribute('y', 4); }
        else { l.t.setAttribute('x', 7); l.t.setAttribute('y', 3.5); }
      }
    });
  }

  /* ---- gestures ---- */
  var ptrs = new Map(), down = null, pinch = null;
  map.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button > 0) return;
    anim = null;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      down = { x: e.clientX, y: e.clientY, tgt: e.target, moved: 0, pan: false };
      map.classList.add('drag');
    } else if (ptrs.size === 2) {
      var a = Array.from(ptrs.values());
      pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
      if (down) down.moved = 99;
    }
  });
  window.addEventListener('pointermove', function (e) {
    var pt = ptrs.get(e.pointerId); if (!pt) return;
    var r = map.getBoundingClientRect();
    if (ptrs.size >= 2 && pinch) {
      pt.x = e.clientX; pt.y = e.clientY;
      var a = Array.from(ptrs.values());
      var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      var mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
      var k = d / pinch.d;
      var ns = Math.min(Math.max(v.s * k, minS), maxS); k = ns / v.s;
      var px = mx - r.left, py = my - r.top;
      setView({ s: ns, tx: px - (px - v.tx) * k + (mx - pinch.mx), ty: py - (py - v.ty) * k + (my - pinch.my) });
      pinch.d = d; pinch.mx = mx; pinch.my = my;
      return;
    }
    var dx = e.clientX - pt.x, dy = e.clientY - pt.y;
    pt.x = e.clientX; pt.y = e.clientY;
    if (down) {
      down.moved += Math.abs(dx) + Math.abs(dy);
      if (down.moved > 6) { down.pan = true; setView({ s: v.s, tx: v.tx + dx, ty: v.ty + dy }); }
    }
  });
  function endPtr(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) {
      map.classList.remove('drag');
      if (down && down.moved <= 6 && e.type === 'pointerup') tap(down.tgt);
      down = null;
    }
  }
  window.addEventListener('pointerup', endPtr);
  window.addEventListener('pointercancel', endPtr);
  map.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = map.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
  }, { passive: false });
  map.addEventListener('keydown', function (e) {
    if (e.target !== map) return;
    var st = 60;
    if (e.key === 'ArrowLeft') setView({ s: v.s, tx: v.tx + st, ty: v.ty });
    else if (e.key === 'ArrowRight') setView({ s: v.s, tx: v.tx - st, ty: v.ty });
    else if (e.key === 'ArrowUp') setView({ s: v.s, tx: v.tx, ty: v.ty + st });
    else if (e.key === 'ArrowDown') setView({ s: v.s, tx: v.tx, ty: v.ty - st });
    else if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.5);
    else if (e.key === '-') zoomAt(W / 2, H / 2, 1 / 1.5);
  });
  map.setAttribute('tabindex', '0');

  function tap(tgt) {
    var n = tgt && tgt.closest ? tgt.closest('[data-id],[data-cluster]') : null;
    if (n && n.getAttribute('data-cluster')) { zoomToCluster(n); return; }
    if (n) { openSheet(n.getAttribute('data-id')); return; }
    if ($('#sheet').classList.contains('open')) closeSheet();
  }
  function zoomToCluster(node) {
    var ids = node.getAttribute('data-cluster').split(',');
    var xs = [], ys = [];
    ids.forEach(function (id) { var s = SITES.filter(function (q) { return q.id === id; })[0]; xs.push(s.xy[0]); ys.push(s.xy[1]); });
    var b = [[Math.min.apply(null, xs), Math.min.apply(null, ys)], [Math.max.apply(null, xs), Math.max.apply(null, ys)]];
    var cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
    var ns = Math.min(v.s * 2.6, maxS);
    var p = pads();
    animateTo({ s: ns, tx: (p.l + (W - p.l - p.r) / 2) - cx * ns, ty: (p.t + (H - p.t - p.b) / 2) - cy * ns }, 320);
  }

  /* ---- controls ---- */
  $('#zin').addEventListener('click', function () { zoomAt(W / 2, H / 2, 1.6); });
  $('#zout').addEventListener('click', function () { zoomAt(W / 2, H / 2, 1 / 1.6); });
  $('#zfit').addEventListener('click', resetView);
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.getAttribute('data-f');
      document.querySelectorAll('.seg button').forEach(function (o) { o.setAttribute('aria-checked', o === b ? 'true' : 'false'); });
      applyStyles(); render();
      if (selected) fillSheet(selected);
    });
  });

  /* ---- detail sheet ---- */
  var sheet = $('#sheet'), appEl = $('#app');
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function badge(r, faded) { return '<span class="badge' + (faded ? ' faded' : '') + '" style="--c:var(--' + r + ')">' + LABEL[r] + '</span>'; }
  function fillSheet(id) {
    var s = SITES.filter(function (q) { return q.id === id; })[0];
    var vw = viewOf(s);
    $('#stitle').textContent = s.name;
    var head = '<div class="head"><h2>' + esc(s.name) + '</h2><p>' + esc(s.sub) + '</p>' +
      (vw.k ? '<span class="badge' + (vw.release ? ' faded' : '') + '" style="--c:var(--' + vw.r + ')">' + LABEL[vw.r] + ' · ' + SP_NAME[vw.k] + (vw.release ? ' · release only' : '') + '</span>' : '') + '</div>';
    var rows = ['coho', 'chinook'].map(function (k) {
      var sp = s[k];
      return '<div class="row"><div class="rt"><div class="nm">' + SP_NAME[k] + '</div><div class="dt">' + esc(sp.d) + '</div></div><div class="ch">' + badge(sp.r, sp.release) + (sp.release ? '<span class="chip">Release only</span>' : '') +
        '<span class="chip' + (Reports.freshness(sp.asOf, TODAY) === 'fresh' ? '' : ' old') + '">' + esc(Reports.describeAge(sp.asOf, TODAY)) + '</span></div></div>';
    }).join('');
    var shield = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.2l6 2.3v4.6c0 4-2.5 6.7-6 8.2-3.5-1.5-6-4.2-6-8.2V4.5z"/><path d="M10 6.8v4M10 13.4v.1"/></svg>';
    var dir = 'https://maps.apple.com/?ll=' + s.ll[0] + ',' + s.ll[1] + '&q=' + encodeURIComponent(s.name);
    var src = '<a href="https://www.theguidesforecast.com/free/coho-run-heats-up/287017/" target="_blank" rel="noopener">The Guide’s Forecast, Oct 17</a>' +
      '<a href="https://www.theguidesforecast.com/sw-washington-fishing-reports/" target="_blank" rel="noopener">SW Washington reports, Oct 15</a>' +
      (s.extra === 'nws' ? '<a href="https://nwsportsmanmag.com/sw-wa-buoy-10-lower-columbia-hanford-reach-report-10-13-2026/" target="_blank" rel="noopener">NW Sportsman, Oct 13</a>' : '');
    $('#sbody').innerHTML =
      head +
      '<section><h3>What’s biting</h3><div class="rows">' + rows + '</div></section>' +
      '<section class="advisory">' + shield + '<div><h3>Before you go</h3><p>Rules change in season and differ by river and species. Confirm this water’s rules on WDFW before you fish.</p></div></section>' +
      '<a class="dir" href="' + dir + '" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14.5 1.5L1.5 6.8l5 1.7 1.7 5z"/></svg>Directions</a>' +
      '<div class="foot"><div>Recent catch reports, not season dates. Not for navigation or safety decisions.</div>' +
      '<a href="https://wdfw.wa.gov/fishing/regulations" target="_blank" rel="noopener">WDFW fishing rules and emergency changes</a>' +
      '<div class="src">' + src + '</div></div>';
    $('#sbody').scrollTop = 0;
  }
  function openSheet(id) {
    selected = id;
    fillSheet(id);
    sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
    appEl.classList.add('sheet-open');
    applyStyles();
    var s = SITES.filter(function (q) { return q.id === id; })[0];
    var wide = window.innerWidth >= 760;
    var sh = sheet.getBoundingClientRect().height || 0;
    var ns = Math.max(v.s, s0 * 1.5);
    var barB = $('#bar').getBoundingClientRect().bottom;
    var tx, ty;
    if (wide) { tx = (W - 392) / 2 - s.xy[0] * ns; ty = H / 2 + 20 - s.xy[1] * ns; }
    else { tx = W / 2 - s.xy[0] * ns; ty = (barB + (H - Math.min(sh, H * 0.66))) / 2 + 24 - s.xy[1] * ns; }
    animateTo({ s: ns, tx: tx, ty: ty }, 320);
  }
  function closeSheet() {
    selected = null;
    sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    appEl.classList.remove('sheet-open');
    applyStyles(); render();
  }
  $('#sdone').addEventListener('click', closeSheet);
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && selected) closeSheet(); });

  /* ---- boot ---- */
  function init() {
    size(); limits();
    var f = fitFor(D.bounds.sw, pads());
    s0 = f.s;
    applyStyles();
    setView(f);
  }
  var ro = window.ResizeObserver ? new ResizeObserver(function () {
    var wasS = v.s / s0;
    size(); limits();
    var f = fitFor(D.bounds.sw, pads()); s0 = f.s;
    if (Math.abs(wasS - 1) < 0.01) setView(f); else setView({ s: v.s, tx: v.tx, ty: v.ty });
  }) : null;
  if (ro) ro.observe(map); else window.addEventListener('resize', function () { size(); limits(); render(); });
  var notice = Reports.staleNotice(SITES, TODAY);
  if (notice) { $('#notice').textContent = notice; $('#notice').hidden = false; }
  $('#sub').textContent = 'Southwest Washington · reports through ' + Reports.formatDay(Reports.latestReport(SITES));
  init();
})();
</script>
