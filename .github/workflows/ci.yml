name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift check: WDFW can rename areas or grow layers past the
    # transfer limit without any commit here.
    - cron: "30 14 * * 1"

jobs:
  wdfw-contract:
    name: WDFW contract + fisheries.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live WDFW contract and curated data
        run: python3 scripts/verify_wdfw_live.py

  tests:
    name: Xcode tests
    # Live pushes and PRs only — the scheduled drift check is about WDFW, not the app.
    if: github.event_name != 'schedule'
    # macos-26 for the iOS 26 SDK. GlassCard calls glassEffect(_:in:) behind an
    # `if #available(iOS 26.0, *)`, but that is a *runtime* check — the compiler
    # still needs the symbol in the SDK it is building against. macos-15 ships
    # Xcode 16 / iOS 18 SDK, where the call does not resolve at all, so every run
    # of this job since it was added has failed to compile rather than run a test.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Informational: the SDK version is the thing that decides whether the
      # iOS 26 calls compile, so put it in the log where a future failure can
      # be read at a glance. Must not fail the job on its own.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator || true

      # Resolve the device instead of naming one. A hardcoded model is a second
      # source of the same drift: 'iPhone 16' was correct on macos-15 and does
      # not exist on macos-26, which ships the iPhone 17 family.
      - name: Pick an iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          candidates = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-([\d-]+)$", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              sys.exit("no available iPhone simulator on this runner")
          version, name, udid = max(candidates)
          pretty = ".".join(map(str, version))
          print("selected " + name + " on iOS " + pretty, file=sys.stderr)
          print(udid)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild -scheme WAFishMap \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            test
